<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Power Ascension</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #0a0a14 70%);
    color: #fff; overflow: hidden; touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center;
    transition: background 1s;
  }
  #shake { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 12px; }
  #shake.shaking { animation: shake 0.5s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); } 20% { transform: translate(-8px,4px); }
    40% { transform: translate(8px,-6px); } 60% { transform: translate(-6px,-4px); } 80% { transform: translate(6px,6px); }
  }
  #tier { margin-top: 10px; font-size: 15px; letter-spacing: 4px; font-weight: 800; }
  #power { font-size: 52px; font-weight: 900; margin: 2px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 24px currentColor; }
  #stats { font-size: 13px; color: #999; margin-bottom: 8px; }
  #aura { width: 190px; height: 190px; border-radius: 50%; margin: 8px 0;
    background: radial-gradient(circle, currentColor 0%, transparent 65%);
    opacity: 0.35; filter: blur(6px); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.12); opacity: 0.45; } }
  #tapbtn {
    width: 190px; height: 190px; border-radius: 50%; margin-top: -198px;
    border: 4px solid currentColor; background: rgba(255,255,255,0.06);
    color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
    transition: transform 0.06s; position: relative; z-index: 2;
  }
  #tapbtn:active { transform: scale(0.93); }
  #shop { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-bottom: 8px; }
  .item { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .item.cant { opacity: 0.45; }
  .item .nm { font-weight: 700; font-size: 15px; }
  .item .ds { font-size: 12px; color: #aaa; }
  .item .cost { font-weight: 800; color: #facc15; white-space: nowrap; margin-left: 10px; }
  .item .own { font-size: 12px; color: #888; }
  #rebirth { margin-top: 6px; background: linear-gradient(135deg,#7c3aed,#db2777); border: none; color: #fff;
    font-weight: 900; letter-spacing: 1px; padding: 12px 22px; border-radius: 24px; font-size: 15px; cursor: pointer; display: none; }
  #best { margin-top: 8px; font-size: 12px; color: #666; }
  .float { position: fixed; font-weight: 900; font-size: 22px; pointer-events: none; z-index: 50;
    animation: rise 0.8s ease-out forwards; text-shadow: 0 0 10px currentColor; }
  @keyframes rise { to { transform: translateY(-90px); opacity: 0; } }
  .particle { position: fixed; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 49;
    animation: boom 1s ease-out forwards; }
  @keyframes boom { to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; transition: opacity 0.1s; }
  #transformName { position: fixed; top: 38%; width: 100%; text-align: center; font-size: 44px; font-weight: 900;
    letter-spacing: 6px; opacity: 0; pointer-events: none; z-index: 61; text-shadow: 0 0 30px currentColor; }
  #transformName.show { animation: tshow 2s ease-out forwards; }
  @keyframes tshow { 0% { opacity: 0; transform: scale(0.7); } 20% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="flash"></div>
<div id="transformName"></div>
<div id="shake">
  <div id="tier">HUMAN</div>
  <div id="power">0</div>
  <div id="stats">+1 per tap · +0 per sec</div>
  <div id="aura"></div>
  <button id="tapbtn">TRAIN</button>
  <div id="shop"></div>
  <button id="rebirth">⚡ ZENKAI REBIRTH ×2 ⚡</button>
  <div id="best"></div>
</div>

<script>
// ================= GAME DATA =================
const TIERS = [
  { at: 0,           name: 'HUMAN',  color: '#7dd3fc' },
  { at: 1000,        name: 'FIGHTER', color: '#4ade80' },
  { at: 25000,       name: 'ELITE',   color: '#fb923c' },
  { at: 500000,      name: 'SUPER',   color: '#facc15' },
  { at: 10000000,    name: 'GOD',     color: '#f472b6' },
  { at: 250000000,   name: 'COSMIC',  color: '#c084fc' },
];
const SHOP = [
  { name: 'Weighted Clothes', desc: '+1 power per tap',      base: 50,    tap: 1,   sec: 0,   owned: 0 },
  { name: 'Gravity Chamber',  desc: '+8 power per tap',      base: 600,   tap: 8,   sec: 0,   owned: 0 },
  { name: 'Sparring Bot',     desc: '+15 power per second',  base: 1500,  tap: 0,   sec: 15,  owned: 0 },
  { name: 'Time Chamber',     desc: '+120 power per second', base: 20000, tap: 0,   sec: 120, owned: 0 },
];
const REBIRTH_AT = 1000000;

let power = 0, zenkai = 1, best = 0, tierIdx = 0;

// ================= SAVE / LOAD =================
function save() {
  localStorage.setItem('pa_save', JSON.stringify({
    power, zenkai, best, owned: SHOP.map(s => s.owned)
  }));
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('pa_save'));
    if (!s) return;
    power = s.power || 0; zenkai = s.zenkai || 1; best = s.best || 0;
    (s.owned || []).forEach((n, i) => { if (SHOP[i]) SHOP[i].owned = n; });
  } catch (e) {}
}

// ================= MATH =================
const cost = s => Math.floor(s.base * Math.pow(1.6, s.owned));
const perTap = () => (1 + SHOP.reduce((a, s) => a + s.tap * s.owned, 0)) * zenkai;
const perSec = () => SHOP.reduce((a, s) => a + s.sec * s.owned, 0) * zenkai;
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const units = ['K','M','B','T','Q'];
  let u = -1;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + units[u];
}
function tierFor(p) { let i = 0; TIERS.forEach((t, k) => { if (p >= t.at) i = k; }); return i; }

// ================= EFFECTS =================
function floatText(x, y, txt, color) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.color = color;
  el.style.left = (x - 20) + 'px'; el.style.top = (y - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}
function burst(color) {
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle'; p.style.background = color;
    p.style.left = '50%'; p.style.top = '40%';
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1050);
  }
}
function transformTo(i) {
  tierIdx = i;
  const t = TIERS[i];
  document.body.style.color = t.color;
  document.getElementById('tier').textContent = t.name;
  document.getElementById('tier').style.color = t.color;
  // flash + shake + name splash
  const flash = document.getElementById('flash');
  flash.style.opacity = 0.85;
  setTimeout(() => flash.style.opacity = 0, 120);
  const sh = document.getElementById('shake');
  sh.classList.remove('shaking'); void sh.offsetWidth; sh.classList.add('shaking');
  const tn = document.getElementById('transformName');
  tn.textContent = t.name; tn.style.color = t.color;
  tn.classList.remove('show'); void tn.offsetWidth; tn.classList.add('show');
  burst(t.color);
  if (navigator.vibrate) navigator.vibrate(80);
}

// ================= UI =================
function renderShop() {
  const shop = document.getElementById('shop');
  shop.innerHTML = '';
  SHOP.forEach((s, i) => {
    const c = cost(s), afford = power >= c;
    const el = document.createElement('div');
    el.className = 'item' + (afford ? '' : ' cant');
    el.innerHTML = `<div><div class="nm">${s.name} <span class="own">×${s.owned}</span></div>` +
      `<div class="ds">${s.desc}</div></div><div class="cost">${fmt(c)} ⚡</div>`;
    el.onclick = () => {
      if (power >= cost(s)) { power -= cost(s); s.owned++; save(); refresh(); }
    };
    shop.appendChild(el);
  });
}
function refresh() {
  const t = TIERS[tierFor(power)];
  if (tierFor(power) > tierIdx) transformTo(tierFor(power));
  else { document.body.style.color = t.color; document.getElementById('tier').textContent = t.name; }
  document.getElementById('power').textContent = fmt(power);
  document.getElementById('power').style.color = t.color;
  document.getElementById('stats').textContent = `+${fmt(perTap())} per tap · +${fmt(perSec())} per sec · zenkai ×${zenkai}`;
  document.getElementById('best').textContent = best > 0 ? 'Best power: ' + fmt(best) : '';
  document.getElementById('rebirth').style.display = power >= REBIRTH_AT ? 'block' : 'none';
  renderShop();
}

// ================= INPUT =================
document.getElementById('tapbtn').addEventListener('pointerdown', e => {
  const gain = perTap();
  power += gain;
  if (power > best) best = power;
  floatText(e.clientX, e.clientY, '+' + fmt(gain), TIERS[tierIdx].color);
  save(); refresh();
});
document.getElementById('rebirth').onclick = () => {
  if (power < REBIRTH_AT) return;
  zenkai *= 2; power = 0;
  SHOP.forEach(s => s.owned = 0);
  tierIdx = 0;
  transformTo(0);
  save(); refresh();
};

// passive gains tick 10x per second
setInterval(() => {
  const g = perSec() / 10;
  if (g > 0) { power += g; if (power > best) best = power; refresh(); }
}, 100);

// ================= START =================
load();
tierIdx = tierFor(power);
refresh();
</script>
</body>
</html>
